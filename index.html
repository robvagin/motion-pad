<!doctype html>

<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Pad</title>
<style>
  :root{ --paper:#f6f5f2; --ink:#1a1a1a; --muted:#8b8880; --line:#dcdad4;
         --accent:#f0435c; --panel:#fdfdfc; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);
    font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)}
  body{display:flex;align-items:center;justify-content:center;padding:24px}

  
  #panel{width:272px;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    display:flex;flex-direction:column;overflow:hidden}
  #tabs{display:flex;border-bottom:1px solid var(--line)}
  #tabs button{flex:1;padding:10px 0;background:none;border:0;font:inherit;color:var(--muted);
    cursor:pointer;text-transform:uppercase;letter-spacing:.06em;font-size:10px}
  #tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -2px var(--ink)}
  #body{padding:12px 14px 16px}
  fieldset{border:0;margin:0 0 14px;padding:0}
  fieldset:last-of-type{margin-bottom:0}
  legend{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    padding:0;margin-bottom:8px}
  .row{display:grid;grid-template-columns:1fr 64px 48px;gap:8px;align-items:center;margin:5px 0}
  .row label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row input[type=range]{width:100%;accent-color:var(--ink);height:2px}
  .row input[type=number]{width:100%;font:10px ui-monospace,monospace;color:var(--muted);
    background:var(--paper);border:1px solid var(--line);border-radius:4px;text-align:right;padding:3px 4px}
  .row input[type=number]:focus{color:var(--ink);outline:none;border-color:var(--ink)}
  .row input[type=number]::-webkit-inner-spin-button{display:none}
  .tin{font:10px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;
    background:var(--paper);color:var(--ink);padding:5px 6px;width:100%}
  .tin:focus{outline:none;border-color:var(--ink)}
  .note{color:var(--muted);font-size:10px;margin:8px 0 0;line-height:1.5}

  
  .pad{position:relative;width:100%;aspect-ratio:1;touch-action:none;cursor:crosshair;margin:2px 0}
  .pad canvas{position:absolute;inset:0;width:100%;height:100%;
    border:1px solid var(--line);border-radius:6px;background:#fff}
  .corner{position:absolute;font-size:9px;letter-spacing:.08em;color:var(--muted);
    text-transform:uppercase;pointer-events:none;user-select:none}
  .c-nw{left:7px;top:6px}.c-ne{right:7px;top:6px}.c-sw{left:7px;bottom:6px}.c-se{right:7px;bottom:6px}
  .prow{margin:7px 0 0}
  .prev{position:relative;height:44px;background:var(--paper);border:1px solid var(--line);
    border-radius:6px;overflow:hidden}
  .prev canvas{position:absolute;inset:0;width:100%;height:100%}

:root{--h-bg:#f6f5f2;--h-card:#ecebe6;--h-field:#ffffff;--h-ink:#1a1a1a;--h-ink2:#3d3c39;--h-ink3:#5c5b57;--h-fill:rgba(26,26,26,.07);--h-fill-hover:rgba(26,26,26,.10);--h-fill-strong:rgba(26,26,26,.15);--h-fill-active:rgba(26,26,26,.24);--h-hair:rgba(26,26,26,.10);--h-line:rgba(26,26,26,.14);--h-seg-on:#ffffff;--h-track-s:.02em;--h-ring:oklch(.49 .08 182);--h-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;--h-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;--h-display:"Inter Tight",-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;
  --paper:var(--h-bg);--ink:var(--h-ink);--muted:var(--h-ink3);--line:var(--h-hair);--accent:var(--h-ink);--panel:var(--h-bg)}
body.dark{--h-bg:#161615;--h-card:#21211f;--h-field:#2b2b29;--h-ink:#ecebe6;--h-ink2:#cfcec8;--h-ink3:#a6a59f;--h-fill:rgba(255,255,255,.07);--h-fill-hover:rgba(255,255,255,.10);--h-fill-strong:rgba(255,255,255,.16);--h-fill-active:rgba(255,255,255,.26);--h-hair:rgba(255,255,255,.10);--h-line:rgba(255,255,255,.14);--h-seg-on:#3d3d3a;--h-track-s:.025em;--h-ring:oklch(.78 .09 182 / .7);--paper:var(--h-bg);--ink:var(--h-ink);--muted:var(--h-ink3);--line:var(--h-hair);--accent:var(--h-ink);--panel:var(--h-bg)}
html,body{font-family:var(--h-sans);font-size:12.5px;line-height:1.45}
#panel,body.dark #panel{background:var(--h-bg);border:1px solid var(--h-hair);border-radius:6px;color:var(--h-ink);box-shadow:none}
#tabs{gap:2px;margin:10px 12px 2px;padding:3px;border:0;border-radius:6px;background:var(--h-fill)}
#tabs button{padding:6px 0;border-radius:4px;font:500 11.5px var(--h-sans);letter-spacing:var(--h-track-s);text-transform:none;color:var(--h-ink2)}
#tabs button[aria-selected="true"],body.dark #tabs button[aria-selected="true"]{background:var(--h-seg-on);color:var(--h-ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
legend{font:600 10.5px var(--h-sans);letter-spacing:.07em;color:var(--h-ink3)}
.row,.selectRow,.colorRow{min-height:28px;margin:4px 0}
.row{grid-template-columns:minmax(0,1fr) 92px 40px}
.row label,.selectRow label,.colorRow label{color:var(--h-ink2);letter-spacing:var(--h-track-s)}
.row input[type=range]{-webkit-appearance:none;appearance:none;height:26px;margin:0;border-radius:4px;cursor:ew-resize;
  background:linear-gradient(90deg,var(--h-fill-strong) var(--p,50%),var(--h-fill) var(--p,50%))}
.row input[type=range]:active{background:linear-gradient(90deg,var(--h-fill-active) var(--p,50%),var(--h-fill) var(--p,50%))}
.row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:2px;height:26px;border-radius:1px;background:var(--h-ink)}
.row input[type=range]::-moz-range-thumb{width:2px;height:26px;border:0;border-radius:1px;background:var(--h-ink)}
.row input[type=number]{border:0;background:transparent;font:12px var(--h-mono);color:var(--h-ink2);text-align:right}
.sw,body.dark .sw{border:0;background:var(--h-fill-strong)}
.sw::before{background:var(--h-field)}
.sw:checked,body.dark .sw:checked{border:0;background:var(--h-ink)}
.sw:checked::before{background:var(--h-bg)}
.tin,.sel,.selectRow select{height:26px;border:0;border-radius:4px;background:var(--h-fill);color:var(--h-ink);font:12px var(--h-sans)}
.seg{gap:2px;padding:3px;border-radius:6px;background:var(--h-fill)}
.seg button{border:0;border-radius:4px;background:transparent;color:var(--h-ink2);font:500 11.5px var(--h-sans)}
.seg button[aria-selected=true],.seg button[aria-pressed=true],body.dark .seg button[aria-selected=true],body.dark .seg button[aria-pressed=true]{border:0;background:var(--h-seg-on);color:var(--h-ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.beh{gap:2px;padding:3px;border-radius:6px;background:var(--h-fill)}
.beh button{border:0;border-radius:4px;background:transparent;color:var(--h-ink2);font:500 11.5px var(--h-sans)}
.beh button[aria-selected="true"]{border:0;background:var(--h-seg-on);color:var(--h-ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
#panel>header b{font:600 10.5px var(--h-sans);letter-spacing:.07em;color:var(--h-ink3)}
.btn{border:0;border-radius:4px;background:var(--h-fill);color:var(--h-ink);font:500 12px var(--h-sans)}
.btn:hover{border:0;background:var(--h-fill-hover)}
.btn.acc{background:var(--h-ink);color:var(--h-bg)}
.mpad canvas,body.dark .mpad canvas{border:0;border-radius:6px;background:var(--h-field)}
.colorRow input[type=color]{border:0;border-radius:4px}
#mtrans button,#mtrans .msp,body.dark #mtrans button,body.dark #mtrans .msp,#uitoggle,body.dark #uitoggle{border:1px solid var(--h-hair);background:var(--h-bg);color:var(--h-ink)}
#mtrans button[aria-pressed="true"]{background:var(--h-ink);color:var(--h-bg)}
:focus-visible{outline:2px solid var(--h-ring);outline-offset:1px}
</style>
</head>
<body>
<div id="panel">
  <div id="tabs"><button aria-selected="true">Motion</button></div>
  <div id="body">
    <fieldset>
      <legend>Motion pad</legend>
      <div class="pad" id="pad">
        <canvas id="padc"></canvas>
        <span class="corner c-nw">soft</span><span class="corner c-ne">raw</span>
        <span class="corner c-sw">slow</span><span class="corner c-se">fast</span>
      </div>
    </fieldset>
    <fieldset>
      <legend>Motion</legend>
      <div class="row">
        <label>Speed</label>
        <input type="range" id="sSpeed" min="0.4" max="2" step="0.01" value="1.15">
        <input type="number" id="nSpeed" min="0.4" max="2" step="0.01" value="1.15">
      </div>
      <div class="prow">
        <select class="tin" id="sEase">
          <option value="balanced">Balanced · center</option>
          <option value="slow">Slow · smooth start and stop</option>
          <option value="fast">Fast · quick settle</option>
          <option value="soft">Soft · deep cushion</option>
          <option value="raw">Raw · linear, mechanical</option>
          <option value="gentle">Gentle · soft and unhurried</option>
          <option value="snappy">Snappy · sharp and lively</option>
        </select>
      </div>
    </fieldset>
    <fieldset>
      <legend>Preview — eased · linear</legend>
      <div class="prev"><canvas id="prevc"></canvas></div>
    </fieldset>
    <p class="note">The dot mixes the four corners. The pale line is the resulting easing, morphing live. The slider and the preset stay in sync with the dot.</p>
  </div>
</div>
<script>
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;

const ARCHETYPES = {
  slow: {
    speed: .55,
    soft: .6,
    ease: t => .5 * (1 - Math.cos(Math.PI * t))
  },
  fast: {
    speed: 1.9,
    soft: .35,
    ease: t => 1 - Math.pow(1 - t, 3)
  },
  soft: {
    speed: .85,
    soft: 1,
    ease: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2
  },
  raw: {
    speed: 1.3,
    soft: 0,
    ease: t => t
  }
};

function motionResolve(x, y) {
  x = clamp01(x);
  y = clamp01(y);
  const w = {
    slow: (1 - x) * (1 - y),
    fast: x * (1 - y),
    soft: (1 - x) * y,
    raw: x * y
  }, A = ARCHETYPES;
  const speed = w.slow * A.slow.speed + w.fast * A.fast.speed + w.soft * A.soft.speed + w.raw * A.raw.speed;
  const soft = w.slow * A.slow.soft + w.fast * A.fast.soft + w.soft * A.soft.soft + w.raw * A.raw.soft;
  const ease = t => {
    t = clamp01(t);
    return w.slow * A.slow.ease(t) + w.fast * A.fast.ease(t) + w.soft * A.soft.ease(t) + w.raw * A.raw.ease(t);
  };
  return {
    speed: speed,
    soft: soft,
    ease: ease
  };
}

function speedToX(target, y) {
  const A = ARCHETYPES, left = (1 - y) * A.slow.speed + y * A.soft.speed, right = (1 - y) * A.fast.speed + y * A.raw.speed;
  return Math.abs(right - left) < 1e-6 ? .5 : clamp01((target - left) / (right - left));
}

const PRESETS = {
  balanced: [ .5, .5 ],
  slow: [ .12, .12 ],
  fast: [ .88, .12 ],
  soft: [ .12, .88 ],
  raw: [ .88, .88 ],
  gentle: [ .3, .7 ],
  snappy: [ .72, .28 ]
};

function nearestPreset(x, y) {
  let best = 'balanced', bd = 1e9;
  for (const k in PRESETS) {
    const dx = PRESETS[k][0] - x, dy = PRESETS[k][1] - y, d = dx * dx + dy * dy;
    if (d < bd) {
      bd = d;
      best = k;
    }
  }
  return best;
}

const CSS = getComputedStyle(document.body);

const INK = CSS.getPropertyValue('--ink').trim(), MUTED = CSS.getPropertyValue('--muted').trim(), ACC = CSS.getPropertyValue('--accent').trim(), LINE = CSS.getPropertyValue('--line').trim();

const pad = document.getElementById('pad'), padc = document.getElementById('padc'), pctx = padc.getContext('2d');

const prevc = document.getElementById('prevc'), rctx = prevc.getContext('2d');

const sSpeed = document.getElementById('sSpeed'), nSpeed = document.getElementById('nSpeed'), sEase = document.getElementById('sEase');

let P = {
  x: .5,
  y: .5
}, cur = motionResolve(.5, .5), phase = 0, lastT = performance.now();

function fit(cv) {
  const dpr = Math.min(devicePixelRatio || 1, 2), r = cv.getBoundingClientRect();
  cv.width = Math.max(1, r.width * dpr);
  cv.height = Math.max(1, r.height * dpr);
  cv.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  return {
    w: r.width,
    h: r.height
  };
}

let PD = fit(padc), RD = fit(prevc);

addEventListener('resize', () => {
  PD = fit(padc);
  RD = fit(prevc);
});

setTimeout(() => {
  PD = fit(padc);
  RD = fit(prevc);
}, 60);

function drawPad() {
  const {w: w, h: h} = PD;
  pctx.clearRect(0, 0, w, h);
  pctx.strokeStyle = LINE;
  pctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const g = i / 4;
    pctx.globalAlpha = .6;
    pctx.beginPath();
    pctx.moveTo(g * w, 0);
    pctx.lineTo(g * w, h);
    pctx.stroke();
    pctx.beginPath();
    pctx.moveTo(0, g * h);
    pctx.lineTo(w, g * h);
    pctx.stroke();
  }
  pctx.globalAlpha = 1;
  const p0 = 14;
  pctx.strokeStyle = ACC;
  pctx.globalAlpha = .28;
  pctx.lineWidth = 2;
  pctx.beginPath();
  for (let i = 0; i <= 60; i++) {
    const t = i / 60, xx = p0 + t * (w - 2 * p0), yy = h - p0 - cur.ease(t) * (h - 2 * p0);
    i ? pctx.lineTo(xx, yy) : pctx.moveTo(xx, yy);
  }
  pctx.stroke();
  pctx.globalAlpha = .12;
  pctx.setLineDash([ 3, 4 ]);
  pctx.beginPath();
  pctx.moveTo(p0, h - p0);
  pctx.lineTo(w - p0, p0);
  pctx.stroke();
  pctx.setLineDash([]);
  pctx.globalAlpha = 1;
  const px = P.x * w, py = (1 - P.y) * h;
  pctx.strokeStyle = INK;
  pctx.globalAlpha = .22;
  pctx.lineWidth = 1;
  pctx.beginPath();
  pctx.moveTo(px, 0);
  pctx.lineTo(px, h);
  pctx.moveTo(0, py);
  pctx.lineTo(w, py);
  pctx.stroke();
  pctx.globalAlpha = 1;
  pctx.fillStyle = INK;
  pctx.beginPath();
  pctx.arc(px, py, 6.5, 0, Math.PI * 2);
  pctx.fill();
  pctx.fillStyle = '#fff';
  pctx.beginPath();
  pctx.arc(px, py, 2.4, 0, Math.PI * 2);
  pctx.fill();
}

function drawPrev(dt) {
  const {w: w, h: h} = RD;
  rctx.clearRect(0, 0, w, h);
  const y0 = h / 2, x0 = 14, x1 = w - 14;
  rctx.strokeStyle = LINE;
  rctx.lineWidth = 1;
  rctx.beginPath();
  rctx.moveTo(x0, y0);
  rctx.lineTo(x1, y0);
  rctx.stroke();
  phase += dt * cur.speed * .6;
  if (phase > 1.35) phase -= 1.35;
  const p = clamp01(phase);
  rctx.fillStyle = MUTED;
  rctx.globalAlpha = .45;
  rctx.beginPath();
  rctx.arc(x0 + p * (x1 - x0), y0 + 9, 3.4, 0, Math.PI * 2);
  rctx.fill();
  rctx.globalAlpha = 1;
  rctx.fillStyle = INK;
  rctx.beginPath();
  rctx.arc(x0 + cur.ease(p) * (x1 - x0), y0 - 9, 5.2, 0, Math.PI * 2);
  rctx.fill();
}

function refresh() {
  const s = cur.speed.toFixed(2);
  sSpeed.value = s;
  nSpeed.value = s;
  sEase.value = nearestPreset(P.x, P.y);
}

function setPoint(x, y) {
  P.x = clamp01(x);
  P.y = clamp01(y);
  cur = motionResolve(P.x, P.y);
  refresh();
  drawPad();
}

function fromEvt(e) {
  const r = pad.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) / r.width,
    y: 1 - (e.clientY - r.top) / r.height
  };
}

let drag = false;

pad.addEventListener('pointerdown', e => {
  drag = true;
  pad.setPointerCapture(e.pointerId);
  const p = fromEvt(e);
  setPoint(p.x, p.y);
});

pad.addEventListener('pointermove', e => {
  if (drag) {
    const p = fromEvt(e);
    setPoint(p.x, p.y);
  }
});

pad.addEventListener('pointerup', () => drag = false);

pad.addEventListener('pointercancel', () => drag = false);

sSpeed.addEventListener('input', () => setPoint(speedToX(+sSpeed.value, P.y), P.y));

nSpeed.addEventListener('change', () => setPoint(speedToX(Math.max(.4, Math.min(2, +nSpeed.value || 1)), P.y), P.y));

sEase.addEventListener('change', () => {
  const q = PRESETS[sEase.value] || [ .5, .5 ];
  setPoint(q[0], q[1]);
});

function loop(now) {
  const dt = Math.min((now - lastT) / 1e3, .05);
  lastT = now;
  drawPad();
  drawPrev(dt);
  requestAnimationFrame(loop);
}

setPoint(.5, .5);

requestAnimationFrame(loop);
</script>
<script>(function(){function u(r){var a=+r.min||0,b=+r.max||100,v=+r.value;r.style.setProperty('--p',((v-a)/((b-a)||1)*100)+'%')}function all(){document.querySelectorAll('input[type=range]').forEach(u)}document.addEventListener('input',function(e){if(e.target&&e.target.type==='range')u(e.target)});setInterval(all,250);all()})();</script>
</body>
</html>
